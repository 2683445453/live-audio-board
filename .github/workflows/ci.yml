name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore LiveAudioBoard.sln

      - name: Verify release metadata
        shell: pwsh
        run: ./scripts/verify-release-metadata.ps1

      - name: Verify formatting
        run: dotnet format LiveAudioBoard.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LiveAudioBoard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LiveAudioBoard.sln --configuration Release --no-build --no-restore

      - name: Scan NuGet vulnerabilities
        shell: pwsh
        run: ./scripts/check-vulnerable-packages.ps1

      - name: Publish smoke test
        run: >-
          dotnet publish src/LiveAudioBoard.App/LiveAudioBoard.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish-smoke
          -p:PublishProfile=win-x64
