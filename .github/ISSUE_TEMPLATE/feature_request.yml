name: Feature request
description: Suggest a noncommercial LiveAudioBoard improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the live-streaming or audio workflow that needs improvement.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: commercial
    attributes:
      label: Intended use
      options:
        - Personal / noncommercial
        - Education / public research
        - Commercial license inquiry
    validations:
      required: true
