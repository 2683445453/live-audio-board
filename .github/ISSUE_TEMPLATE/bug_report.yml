name: Bug report
description: Report a reproducible LiveAudioBoard problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API credentials, access tokens, private audio, or personal information.
  - type: input
    id: version
    attributes:
      label: LiveAudioBoard version
      placeholder: 0.22.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove secrets and private paths before attaching logs.
  - type: checkboxes
    id: license
    attributes:
      label: Usage confirmation
      options:
        - label: This report does not request or imply permission for commercial use.
          required: true
